    <!-- Google Analytics (GA4) — Consent-Aware -->
    <script>
      // Only load GA4 if user has given analytics consent
      function loadGA4() {
        if (document.querySelector('script[src*="googletagmanager.com/gtag"]')) return;
        var s = document.createElement('script');
        s.async = true;
        s.src = 'https://www.googletagmanager.com/gtag/js?id=G-QR4GP78RY3';
        document.head.appendChild(s);
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        window.gtag = gtag;
        gtag('js', new Date());
        gtag('config', 'G-QR4GP78RY3', { anonymize_ip: true });
      }
      // Check on load
      try {
        var consent = JSON.parse(localStorage.getItem('atideto_cookie_consent') || '{}');
        if (consent.analytics) loadGA4();
      } catch(e) {}
      // Listen for consent changes
      window.addEventListener('cookie-consent-updated', function(e) {
        if (e.detail && e.detail.analytics) loadGA4();
      });
    </script>

            y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
