    <meta name="theme-color" content="#050505" />

    <link rel="manifest" href="/manifest.json" />

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&family=Montserrat:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />

    <!-- Schema.org JSON-LD -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Atideto",
      "url": "https://atideto.in",
      "description": "Premium software company delivering digital experiences beyond imagination"
    }
    </script>

    <!-- OpenGraph Image Fallback -->
    <meta property="og:image" content="https://atideto.in/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Google Analytics (GA4) — Consent-Aware -->
    <script>
      // Only load GA4 if user has given analytics consent
      function loadGA4() {
        if (document.querySelector('script[src*="googletagmanager.com/gtag"]')) return;
        var s = document.createElement('script');
        s.async = true;
        s.src = 'https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX';
        document.head.appendChild(s);
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        window.gtag = gtag;
        gtag('js', new Date());
        gtag('config', 'G-XXXXXXXXXX', { anonymize_ip: true });
      }
      // Check on load
      try {
        var consent = JSON.parse(localStorage.getItem('atideto_cookie_consent') || '{}');
        if (consent.analytics) loadGA4();
      } catch(e) {}
      // Listen for consent changes
      window.addEventListener('cookie-consent-updated', function(e) {
        if (e.detail && e.detail.analytics) loadGA4();
      });
    </script>

    <!-- Microsoft Clarity — Consent-Aware -->
    <script>
      function loadClarity() {
        if (window.clarity) return;
        (function(c,l,a,r,i,t,y){
            c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
            t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
            y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
        })(window,document,"clarity","script","xxxxxxxxxx");
      }
      try {
        var consent2 = JSON.parse(localStorage.getItem('atideto_cookie_consent') || '{}');
        if (consent2.analytics) loadClarity();
      } catch(e) {}
      window.addEventListener('cookie-consent-updated', function(e) {
        if (e.detail && e.detail.analytics) loadClarity();
      });
    </script>
  </head>

  <body>
    <div id="root"></div>

  </body>
